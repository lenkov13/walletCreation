<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>How DeFi Lending Protocols Work</title>
<style>
  html,body{
    margin:0;
    padding:0;
    background:#ffffff;
    font-family:Arial,"Helvetica Neue",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  .wrap{
    max-width:1200px;
    margin:0 auto;
    padding:24px 16px;
  }
  svg text{ font-family:Arial,"Helvetica Neue",system-ui,-apple-system,"Segoe UI",sans-serif; }
</style>
</head>
<body>
<div class="wrap">
<svg viewBox="0 0 1200 520" width="100%" height="auto" role="img" aria-label="Diagram showing how DeFi lending protocols work: lenders supply a pool, borrowers borrow against collateral, and liquidators step in if collateral value falls too far">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2C5A82"/>
    </marker>
  </defs>

  <!-- outer dashed container -->
  <rect x="50" y="40" width="1100" height="290" rx="16" fill="none" stroke="#8FA3B8" stroke-width="1.5" stroke-dasharray="7,6"/>

  <!-- Box 1: Lender -->
  <rect x="90" y="95" width="270" height="150" rx="14" fill="#E8ECF3" stroke="#2C5A82" stroke-width="2.5"/>
  <text x="225" y="140" text-anchor="middle" font-size="21" font-weight="700" fill="#111111">Lender</text>
  <text x="225" y="172" text-anchor="middle" font-size="15" fill="#333333">Deposits USDC</text>
  <text x="225" y="196" text-anchor="middle" font-size="15" fill="#333333">Balance: 10,000 USDC</text>

  <!-- Box 2: Lending Pool -->
  <rect x="465" y="95" width="270" height="150" rx="14" fill="#E8ECF3" stroke="#2C5A82" stroke-width="2.5"/>
  <text x="600" y="140" text-anchor="middle" font-size="21" font-weight="700" fill="#111111">Lending Pool</text>
  <text x="600" y="172" text-anchor="middle" font-size="15" fill="#333333">Pooled on-chain liquidity</text>
  <text x="600" y="196" text-anchor="middle" font-size="15" fill="#333333">Utilization: 72%</text>

  <!-- Box 3: Borrower -->
  <rect x="840" y="95" width="270" height="150" rx="14" fill="#E8ECF3" stroke="#2C5A82" stroke-width="2.5"/>
  <text x="975" y="140" text-anchor="middle" font-size="21" font-weight="700" fill="#111111">Borrower</text>
  <text x="975" y="172" text-anchor="middle" font-size="15" fill="#333333">Locks ETH as collateral</text>
  <text x="975" y="196" text-anchor="middle" font-size="15" fill="#333333">Collateral ratio: 150%</text>

  <!-- arrow 1 -->
  <line x1="360" y1="170" x2="459" y2="170" stroke="#2C5A82" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="412" y="144" text-anchor="middle" font-size="13" fill="#333333">supply APY</text>
  <text x="412" y="160" text-anchor="middle" font-size="13" fill="#333333">&#8776; 4%</text>

  <!-- arrow 2 -->
  <line x1="735" y1="170" x2="834" y2="170" stroke="#2C5A82" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="787" y="144" text-anchor="middle" font-size="13" fill="#333333">borrow APY</text>
  <text x="787" y="160" text-anchor="middle" font-size="13" fill="#333333">&#8776; 6%</text>

  <!-- branch down to liquidator -->
  <path d="M 975 245 L 975 316 L 600 316 L 600 341" fill="none" stroke="#8FA3B8" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrow)"/>
  <text x="800" y="298" text-anchor="middle" font-size="13.5" fill="#5a5a5a">if collateral value falls below the liquidation threshold</text>

  <!-- Box 4: Liquidator -->
  <rect x="465" y="345" width="270" height="150" rx="14" fill="#E8ECF3" stroke="#2C5A82" stroke-width="2.5"/>
  <text x="600" y="390" text-anchor="middle" font-size="21" font-weight="700" fill="#111111">Liquidator</text>
  <text x="600" y="422" text-anchor="middle" font-size="15" fill="#333333">Repays the outstanding debt</text>
  <text x="600" y="446" text-anchor="middle" font-size="15" fill="#333333">Seizes collateral + 5&ndash;10% bonus</text>
</svg>
</div>
</body>
</html>
