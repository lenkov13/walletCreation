<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Как работают оракулы</title>
<style>
  html,body{
    margin:0;
    padding:0;
    background:#ffffff;
    font-family:Arial,"Helvetica Neue",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  .wrap{
    max-width:1200px;
    margin:0 auto;
    padding:24px 16px;
  }
  svg text{ font-family:Arial,"Helvetica Neue",system-ui,-apple-system,"Segoe UI",sans-serif; }
</style>
</head>
<body>
<div class="wrap">
<svg viewBox="0 0 1200 340" width="100%" height="auto" role="img" aria-label="Схема: как оракулы передают внешние данные в смарт-контракты">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2C5A82"/>
    </marker>
  </defs>

  <!-- outer dashed container -->
  <rect x="50" y="40" width="1100" height="270" rx="16" fill="none" stroke="#8FA3B8" stroke-width="1.5" stroke-dasharray="7,6"/>

  <!-- Box 1: Внешние данные -->
  <rect x="90" y="95" width="270" height="150" rx="14" fill="#E8ECF3" stroke="#2C5A82" stroke-width="2.5"/>
  <text x="225" y="140" text-anchor="middle" font-size="21" font-weight="700" fill="#111111">Внешние данные</text>
  <text x="225" y="172" text-anchor="middle" font-size="15" fill="#333333">Курсы, цены активов</text>
  <text x="225" y="196" text-anchor="middle" font-size="15" fill="#333333">API бирж, IoT-датчики</text>

  <!-- Box 2: Оракул -->
  <rect x="465" y="95" width="270" height="150" rx="14" fill="#E8ECF3" stroke="#2C5A82" stroke-width="2.5"/>
  <text x="600" y="140" text-anchor="middle" font-size="21" font-weight="700" fill="#111111">Оракул</text>
  <text x="600" y="172" text-anchor="middle" font-size="15" fill="#333333">Сбор и агрегация данных</text>
  <text x="600" y="196" text-anchor="middle" font-size="15" fill="#333333">Криптографическая подпись</text>

  <!-- Box 3: Смарт-контракт -->
  <rect x="840" y="95" width="270" height="150" rx="14" fill="#E8ECF3" stroke="#2C5A82" stroke-width="2.5"/>
  <text x="975" y="140" text-anchor="middle" font-size="21" font-weight="700" fill="#111111">Смарт-контракт</text>
  <text x="975" y="172" text-anchor="middle" font-size="15" fill="#333333">Использует данные в логике</text>
  <text x="975" y="196" text-anchor="middle" font-size="15" fill="#333333">Ликвидации, деривативы, DeFi</text>

  <!-- arrow 1 -->
  <line x1="360" y1="170" x2="459" y2="170" stroke="#2C5A82" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="412" y="144" text-anchor="middle" font-size="13" fill="#333333">агрегация</text>
  <text x="412" y="160" text-anchor="middle" font-size="13" fill="#333333">источников</text>

  <!-- arrow 2 -->
  <line x1="735" y1="170" x2="834" y2="170" stroke="#2C5A82" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="787" y="144" text-anchor="middle" font-size="13" fill="#333333">публикация</text>
  <text x="787" y="160" text-anchor="middle" font-size="13" fill="#333333">ончейн</text>
</svg>
</div>
</body>
</html>
