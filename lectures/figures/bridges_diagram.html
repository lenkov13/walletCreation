<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Как работают блокчейн-мосты</title>
<style>
  html,body{ margin:0; padding:0; background:#ffffff; font-family:Arial,"Helvetica Neue",system-ui,-apple-system,"Segoe UI",sans-serif; }
  .wrap{ max-width:1200px; margin:0 auto; padding:24px 16px; }
  svg text{ font-family:Arial,"Helvetica Neue",system-ui,-apple-system,"Segoe UI",sans-serif; }
</style>
</head>
<body>
<div class="wrap">
<svg viewBox="0 0 1200 450" width="100%" height="auto" role="img" aria-label="Схема: как работает блокчейн-мост между двумя сетями">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2C5A82"/>
    </marker>
  </defs>

  <!-- Panel A: Chain A -->
  <rect x="60" y="60" width="380" height="300" rx="20" fill="#F5F7FA" stroke="#8FA3B8" stroke-width="1.5" stroke-dasharray="7,6"/>
  <text x="250" y="95" text-anchor="middle" font-size="18" font-weight="700" fill="#2C5A82">Сеть A &middot; Ethereum</text>
  <rect x="100" y="170" width="300" height="120" rx="14" fill="#E8ECF3" stroke="#2C5A82" stroke-width="2.5"/>
  <text x="250" y="215" text-anchor="middle" font-size="21" font-weight="700" fill="#111111">Контракт-хранилище</text>
  <text x="250" y="247" text-anchor="middle" font-size="15" fill="#333333">Блокирует 10 ETH</text>
  <text x="250" y="271" text-anchor="middle" font-size="15" fill="#333333">Событие для валидаторов</text>

  <!-- Panel B: Chain B -->
  <rect x="760" y="60" width="380" height="300" rx="20" fill="#F5F7FA" stroke="#8FA3B8" stroke-width="1.5" stroke-dasharray="7,6"/>
  <text x="950" y="95" text-anchor="middle" font-size="18" font-weight="700" fill="#2C5A82">Сеть B &middot; Arbitrum</text>
  <rect x="800" y="170" width="300" height="120" rx="14" fill="#E8ECF3" stroke="#2C5A82" stroke-width="2.5"/>
  <text x="950" y="215" text-anchor="middle" font-size="21" font-weight="700" fill="#111111">Контракт-минтер</text>
  <text x="950" y="247" text-anchor="middle" font-size="15" fill="#333333">Чеканит 10 wETH</text>
  <text x="950" y="271" text-anchor="middle" font-size="15" fill="#333333">Доступен пользователю</text>

  <!-- Middle node: validators -->
  <rect x="530" y="170" width="140" height="120" rx="14" fill="#E8ECF3" stroke="#2C5A82" stroke-width="2.5"/>
  <text x="600" y="205" text-anchor="middle" font-size="16" font-weight="700" fill="#111111">Валидаторы</text>
  <text x="600" y="224" text-anchor="middle" font-size="16" font-weight="700" fill="#111111">моста</text>
  <text x="600" y="252" text-anchor="middle" font-size="12" fill="#333333">проверяют</text>
  <text x="600" y="270" text-anchor="middle" font-size="12" fill="#333333">событие</text>

  <!-- forward arrows -->
  <line x1="400" y1="230" x2="521" y2="230" stroke="#2C5A82" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="460" y="216" text-anchor="middle" font-size="13" fill="#333333">наблюдение</text>

  <line x1="670" y1="230" x2="791" y2="230" stroke="#2C5A82" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="730" y="216" text-anchor="middle" font-size="13" fill="#333333">чеканка</text>

  <!-- reverse flow -->
  <path d="M 950 378 L 950 405 L 250 405 L 250 378" fill="none" stroke="#8FA3B8" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arrow)"/>
  <text x="600" y="397" text-anchor="middle" font-size="13" fill="#5a5a5a">обратно: сжигание на B &#8594; разблокировка на A</text>
</svg>
</div>
</body>
</html>
